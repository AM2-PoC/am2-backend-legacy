upstream am2_apache_webadmin {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name webadmin.am2-poc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name webadmin.am2-poc.com;

    ssl_certificate /etc/letsencrypt/live/webadmin.am2-poc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webadmin.am2-poc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/am2_webadmin_access.log;
    error_log  /var/log/nginx/am2_webadmin_error.log warn;

    client_max_body_size 100m;

    # Headers and the deny rules, shared with staging so the two cannot drift.
    include snippets/am2-webadmin-dev-deny.conf;
    include snippets/am2-webadmin-security.conf;
    set $am2_asset_upstream am2_apache_webadmin;
    include snippets/am2-webadmin-assets.conf;

    # HTTPS has been served here for months and the redirect above is
    # unconditional, so the condition this was waiting on is met. Short max-age
    # to begin with: HSTS is remembered by the browser and cannot be withdrawn
    # quickly, so it is raised deliberately rather than started at six months.
    add_header Strict-Transport-Security "max-age=300" always;

    # The admin update manifest and APK are one mutable release set. They keep
    # stable URLs, so neither browsers nor Cloudflare may retain either member
    # across a publication; otherwise a fresh manifest can name stale APK bytes.
    # `^~` is intentional: the shared sensitive-extension regex also matches
    # `.json`, so a regex location here would lose to it before the cache guard
    # can run. This prefix owns the update directory; only the two canonical
    # release-set files are allowed and everything else is an opaque 404.
    location ^~ /update/ {
        location = /update/admin.apk {
            proxy_pass http://am2_apache_webadmin;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location = /update/admin_version.json {
            proxy_pass http://am2_apache_webadmin;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location ^~ /update/ { access_log off; return 404; }
    }

    location = / {
        return 302 /login.php;
    }    

    location = /login.php {
        limit_req zone=am2_webadmin_login burst=5 nodelay;
        proxy_pass http://am2_apache_webadmin;
        include snippets/am2-proxy-common.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://am2_apache_webadmin;
        include snippets/am2-proxy-common.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
