upstream am2_apache_webadmin {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name webadmin.am2-poc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name webadmin.am2-poc.com;

    ssl_certificate /etc/letsencrypt/live/webadmin.am2-poc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webadmin.am2-poc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/am2_webadmin_access.log;
    error_log  /var/log/nginx/am2_webadmin_error.log warn;

    client_max_body_size 100m;

    # Safe headers. CSP is not enabled here because current PHP pages may use inline scripts/styles.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Enable HSTS only after HTTPS is fully verified.
    # add_header Strict-Transport-Security "max-age=15552000" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:env|ini|log|bak|sql|zip|tar|gz)(?:\.[^/]*)?$ {
        # The suffix may not be last. A hand-made backup named
        # config.php.bak.2026-05-03-182146 ends in the timestamp, not in
        # .bak, so the anchored form let it through -- verified serving
        # 200 from the production web root on 2026-08-09.
        deny all;
    }

    # Hard block one-time bootstrap/installer endpoints.
    # Use 404 instead of 403 so scanners do not get confirmation that the file exists.
    location ~* ^/(setup[_-]?admin|setup|install|installer)\.php$ {
        access_log off;
        return 404;
    }
    
    location = / {
        return 302 /login.php;
    }    

    location = /login.php {
        limit_req zone=am2_webadmin_login burst=5 nodelay;
        proxy_pass http://am2_apache_webadmin;
        include snippets/am2-proxy-common.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://am2_apache_webadmin;
        include snippets/am2-proxy-common.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
