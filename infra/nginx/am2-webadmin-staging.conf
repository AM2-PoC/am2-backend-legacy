upstream am2_apache_staging {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name staging-webadmin.am2-poc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-webadmin.am2-poc.com;

    ssl_certificate     /etc/letsencrypt/live/staging-webadmin.am2-poc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-webadmin.am2-poc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/am2_staging_access.log;
    error_log  /var/log/nginx/am2_staging_error.log warn;

    client_max_body_size 150m;

    # Staging is not production data and must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\.(?!well-known) { deny all; }

    # Staging runs a branch that does not yet carry the api_settings.php
    # session gate (that fix is on main, deployed to production on 2026-08-09).
    # Staging holds a full restore of production personal data, so it keeps the
    # edge deny until it is redeployed from a branch that includes the fix.
    location = /api_settings.php {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://am2_apache_staging;
        proxy_http_version 1.1;
        include snippets/am2-proxy-common.conf;
    }
}
