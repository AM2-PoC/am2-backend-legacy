upstream am2_apache_staging {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name staging-webadmin.am2-poc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-webadmin.am2-poc.com;

    ssl_certificate     /etc/letsencrypt/live/staging-webadmin.am2-poc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-webadmin.am2-poc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/am2_staging_access.log;
    error_log  /var/log/nginx/am2_staging_error.log warn;

    client_max_body_size 150m;

    # Staging restores from a production dump, so what is behind this vhost is
    # real personal data on a host anyone can reach. It must never be indexed,
    # and it gets the same edge rules production does -- the earlier version of
    # this file had only the dotfile deny, which left .bak, .sql and .env
    # readable here while production denied them.
    add_header X-Robots-Tag "noindex, nofollow" always;

    include snippets/am2-webadmin-dev-deny.conf;
    include snippets/am2-webadmin-security.conf;
    set $am2_asset_upstream am2_apache_staging;
    include snippets/am2-webadmin-assets.conf;
    add_header Strict-Transport-Security "max-age=300" always;

    # The admin update manifest and APK are one mutable release set. They keep
    # stable URLs, so neither browsers nor Cloudflare may retain either member
    # across a publication; otherwise a fresh manifest can name stale APK bytes.
    # `^~` is intentional: the shared sensitive-extension regex also matches
    # `.json`, so a regex location here would lose to it before the cache guard
    # can run. This prefix owns the update directory; only the two canonical
    # release-set files are allowed and everything else is an opaque 404.
    location ^~ /update/ {
        location = /update/admin.apk {
            proxy_pass http://am2_apache_staging;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location = /update/admin_version.json {
            proxy_pass http://am2_apache_staging;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location ^~ /update/ { access_log off; return 404; }
    }

    location = / {
        return 302 /login.php;
    }

    # The same throttle production has. Staging shares production's password
    # hashes, so an unthrottled login form here is an unthrottled login form for
    # those credentials.
    location = /login.php {
        limit_req zone=am2_webadmin_login burst=5 nodelay;
        proxy_pass http://am2_apache_staging;
        proxy_http_version 1.1;
        include snippets/am2-proxy-common.conf;
    }

    location / {
        proxy_pass http://am2_apache_staging;
        proxy_http_version 1.1;
        include snippets/am2-proxy-common.conf;
    }
}
