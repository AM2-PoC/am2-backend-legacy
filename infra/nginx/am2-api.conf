upstream am2_node_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name apiapi.am2-poc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name apiapi.am2-poc.com;

    ssl_certificate /etc/letsencrypt/live/apiapi.am2-poc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiapi.am2-poc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/am2_api_access.log;
    error_log  /var/log/nginx/am2_api_error.log warn;

    client_max_body_size 150m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Do not add Basic Auth here. APK/WebSocket clients will not send it.
    # Do not add aggressive rate limits here. PTT/WebSocket sessions are long-lived.

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Internal-only control plane. The PHP panel reaches these over
    # http://localhost:5000, never through nginx, so denying them here has no
    # functional impact. The remaining /api/admin/ routes are used by the Admin
    # Native app and need a real credential -- handled in the security release.
    # Case-insensitive with an optional trailing slash because Express routing
    # defaults to caseSensitive:false and strict:false.
    location ~* ^/api/admin/(sync-channels|refresh-branch-permissions|force-logout|update-permissions)/?$ {
        deny all;
    }

    location ^~ /update/ {
        location = /update/version.json {
            proxy_pass http://am2_node_api;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            proxy_hide_header Cache-Control;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location = /update/update.apk {
            proxy_pass http://am2_node_api;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            proxy_hide_header Cache-Control;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location ^~ /update/ { access_log off; return 404; }
    }

    location / {
        proxy_pass http://am2_node_api;
        proxy_http_version 1.1;

        include snippets/am2-proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
