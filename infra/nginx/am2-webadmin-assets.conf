# How static assets are compressed and cached.
#
# This file exists because of a production incident on 2026-08-09. The redesign
# stopped loading Bootstrap, FontAwesome, jQuery and Leaflet from public CDNs
# and started serving them from this origin -- a deliberate privacy decision,
# and the right one. What nobody accounted for is that the CDNs were also doing
# the compression and the caching.
#
# After the switch the panel served, per first page load and uncompressed:
#
#     asset/js/am2-ui.min.js     205 KB
#     asset/css/am2-tailwind.css  68 KB
#     asset/font/*.woff2         380 KB
#
# nginx's gzip_types was commented out in nginx.conf, so its default applies and
# that default is text/html alone -- every one of those files went out raw. And
# no location set an expiry, so Cloudflare would not hold them and every
# navigation revalidated the lot. On staging, with one tester and a warm browser
# cache, none of this shows. On production it reads as "the panel got slow".
#
# Deployed to /etc/nginx/snippets/am2-webadmin-assets.conf and included from the
# server block of each WebAdmin vhost.

# Compression, declared here rather than left to the global default. woff2 is
# deliberately absent: it is already compressed, and gzipping it again costs CPU
# to make the file marginally larger.
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;

# Long-lived caching, which is only safe because the URLs carry a version.
# am2_asset() (WebAdmin/i18n.php) appends ?v=<filemtime>, so a changed file is a
# changed URL and `immutable` never serves a stale build.
location ~* ^/asset/.+\.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|map)$ {
    # The including vhost sets this to its own Apache upstream. Keeping the
    # route shared must not make staging read production's document root.
    proxy_pass http://$am2_asset_upstream;
    include snippets/am2-proxy-common.conf;

    expires 30d;
    # `immutable` stops the browser revalidating on reload; the version query is
    # what makes that correct.
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    # add_header in a location replaces what the server block set rather than
    # adding to it, so the one header that still matters for a static file is
    # restated here. The rest (frame options, referrer policy) describe
    # documents, not assets.
    add_header X-Content-Type-Options "nosniff" always;

    access_log off;
}
