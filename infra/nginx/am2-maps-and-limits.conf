map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Only for WebAdmin login, not for WebSocket/PTT traffic.
limit_req_zone $binary_remote_addr zone=am2_webadmin_login:10m rate=10r/m;

# The field update channel is deliberately unauthenticated: a handset that
# cannot sign in must still be able to update, because the update is how the
# reason it cannot sign in gets fixed. The price is that anyone may fetch a
# nine megabyte APK, so the channel is metered rather than closed.
#
# Generous on purpose. A site's whole fleet shares one NAT address and may
# check for an update within the same minute; the limit is here to stop a
# scraper looping, not to ration a shipment.
limit_req_zone $binary_remote_addr zone=am2_update:10m rate=60r/m;
