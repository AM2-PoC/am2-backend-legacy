upstream am2_node_api_staging {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80;
    server_name staging-apiapi.am2-poc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-apiapi.am2-poc.com;

    ssl_certificate /etc/letsencrypt/live/staging-apiapi.am2-poc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-apiapi.am2-poc.com/privkey.pem;
    include /etc/nginx/snippets/am2-staging-legacy-tls.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Staging Client supports Jelly Bean/KitKat with TLS 1.2 only.
    # RSA AES-CBC suites are scoped to this vhost for those legacy stacks.
    ssl_ciphers "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:AES256-SHA";

    access_log /var/log/nginx/am2_api_staging_access.log;
    error_log  /var/log/nginx/am2_api_staging_error.log warn;

    client_max_body_size 150m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # The whole prefix, not a hand-listed set of route names. The panel reaches
    # these over 127.0.0.1 and never through this server block, so nothing
    # legitimate arrives here -- and a route added later is denied by default
    # instead of exposed until somebody remembers this file.
    location ^~ /api/admin/ {
        deny all;
    }

    # A stable manifest/APK pair is an immutable release set. The exact
    # canonical members are public for legacy Clients; every other path and URL
    # alias is closed so an accidental residue cannot become an update channel.
    location ^~ /update/ {
        location = /update/version.json {
            proxy_pass http://am2_node_api_staging;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            proxy_hide_header Cache-Control;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location = /update/update.apk {
            proxy_pass http://am2_node_api_staging;
            proxy_http_version 1.1;
            include snippets/am2-proxy-common.conf;
            proxy_hide_header Cache-Control;
            expires off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
        location ^~ /update/ { access_log off; return 404; }
    }

    location / {
        proxy_pass http://am2_node_api_staging;
        proxy_http_version 1.1;
        include snippets/am2-proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
