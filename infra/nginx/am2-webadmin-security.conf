# Edge hardening shared by every WebAdmin vhost.
#
# This file exists because the production and staging vhosts had drifted apart.
# Production denied a list of sensitive extensions, 404'd the one-time installer
# endpoints and set four security headers; staging -- which holds a full copy of
# production's personal data and is reachable from the internet -- had only the
# dotfile deny. Nobody decided that. The two files were written months apart and
# only one of them was kept up to date, which is what a second copy always
# eventually does.
#
# Included from the server block of each vhost. Anything that differs per
# environment (upstreams, certificates, rate-limit zones, robots) stays in the
# vhost; only what should be identical everywhere lives here.
#
# Deployed to /etc/nginx/snippets/am2-webadmin-security.conf.

# CSP is deliberately absent: the PHP pages still carry inline scripts and
# styles, and a policy that has to allow 'unsafe-inline' is a policy that says
# nothing. It belongs with the work that removes them.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Dotfiles, except the ACME challenge the certificates renew through.
location ~ /\.(?!well-known) {
    deny all;
}

# Backups in the field use both dots and timestamp separators after the
# sensitive extension: config.php.bak.2026-05-03 and
# admin_version.json.bak-20260816. Accept dot, hyphen, or underscore so all of
# those names are denied rather than served as ordinary static files.
location ~* \.(?:env|ini|log|bak|sql|zip|tar|gz)(?:[._-][^/]*)?$ {
    access_log off;
    return 404;
}

# One-time bootstrap endpoints. 404 rather than 403 so a scanner gets no
# confirmation that the file is there.
location ~* ^/(setup[_-]?admin|setup|install|installer)\.php$ {
    access_log off;
    return 404;
}
