# Repository/development artifacts are not part of the public WebAdmin surface.
# Return 404 so scanners cannot distinguish an existing artifact from an absent one.
location ~ /\.(?!well-known) { access_log off; return 404; }
location ~* ^/(?:docs|infra|tests|\.github|\.git)(?:/|$) { access_log off; return 404; }
location ~* ^/(?:package(?:-lock)?\.json|composer\.(?:json|lock)|README(?:\.[^/]*)?|CHANGELOG(?:\.[^/]*)?|server/struktur_am2\.sql)$ { access_log off; return 404; }
location ~* ^/WebAdmin/(?:package(?:-lock)?\.json|node_modules(?:/|$)) { access_log off; return 404; }
