<VirtualHost 127.0.0.1:8080>
    ServerName webadmin.am2-poc.com
    ServerAdmin admin@am2-poc.com

    DocumentRoot /var/www/am2/current/WebAdmin
    DirectoryIndex login.php index.php index.html
    SetEnv AM2_ADMIN_UPDATE_BASE_URL https://webadmin.am2-poc.com/update

    # Defense in depth for requests that reach the loopback Apache origin
    # without passing through nginx.
    RedirectMatch 404 "^/(docs|infra|tests|\.github|\.git)(/|$)"
    RedirectMatch 404 "^/(package(-lock)?\.json|composer\.(json|lock)|README(\.[^/]*)?|CHANGELOG(\.[^/]*)?|server/struktur_am2\.sql)$"
    RedirectMatch 404 "^/(WebAdmin/)?(package(-lock)?\.json|node_modules(/|$))"

    <Directory /var/www/am2/current/WebAdmin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|ini|log|bak|sql|zip|tar|gz)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(setup[_-]?admin|setup|install|installer)\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/am2_webadmin_error.log
    CustomLog ${APACHE_LOG_DIR}/am2_webadmin_access.log combined
</VirtualHost>
