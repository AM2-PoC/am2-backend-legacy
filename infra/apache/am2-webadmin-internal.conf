<VirtualHost 127.0.0.1:8080>
    ServerName webadmin.am2-poc.com
    ServerAdmin admin@am2-poc.com

    DocumentRoot /var/www/am2/current/WebAdmin
    # Each lane keeps its own session store.
    #
    # Both shared /var/lib/php/sessions until 2026-09-04, and a staging session
    # was accepted by production as a superadmin -- measured, not inferred: the
    # same PHPSESSID answered 200 on both lanes. ct_super is a fixture account
    # with no row on production at all. Now that identity comes only from
    # $_SESSION, a shared store is not untidiness, it is the authentication
    # system. Written here rather than only applied to the host, so redeploying
    # these files cannot silently undo it.
    php_value session.save_path /var/lib/php/sessions/am2
    DirectoryIndex login.php index.php index.html
    SetEnv AM2_ADMIN_UPDATE_BASE_URL https://webadmin.am2-poc.com/update

    # Defense in depth for requests that reach the loopback Apache origin
    # without passing through nginx.
    RedirectMatch 404 "^/(docs|infra|tests|\.github|\.git)(/|$)"
    RedirectMatch 404 "^/(package(-lock)?\.json|composer\.(json|lock)|README(\.[^/]*)?|CHANGELOG(\.[^/]*)?|server/struktur_am2\.sql)$"
    RedirectMatch 404 "^/(WebAdmin/)?(package(-lock)?\.json|node_modules(/|$))"

    <Directory /var/www/am2/current/WebAdmin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|ini|log|bak|sql|zip|tar|gz)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(setup[_-]?admin|setup|install|installer)\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/am2_webadmin_error.log
    # %h is the peer, and the peer is always nginx on the loopback, so the
    # stock `combined` format records 127.0.0.1 for every request ever made.
    # X-Real-IP is what nginx resolved -- the Cloudflare edge before
    # am2-cloudflare-realip.conf existed, the actual visitor after it. Logged
    # first so the address is the first thing on the line, where a reader looks.
    LogFormat "%{X-Real-IP}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" am2_visitor
    CustomLog ${APACHE_LOG_DIR}/am2_webadmin_access.log am2_visitor
</VirtualHost>
