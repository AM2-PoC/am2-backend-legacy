<VirtualHost 127.0.0.1:8081>
    ServerName staging-webadmin.am2-poc.com
    DocumentRoot /var/www/am2/staging/current/WebAdmin
    # Production and staging must never share authenticated session state.
    php_value session.save_path /var/lib/php/sessions/am2-staging
    DirectoryIndex login.php index.php index.html

    # Points config.php at the staging env file, which in turn selects the
    # staging database and the staging node relay on 5001.
    SetEnv AM2_ENV_FILE /etc/am2/webadmin.env.staging
    SetEnv AM2_ADMIN_UPDATE_BASE_URL https://staging-webadmin.am2-poc.com/update
    # The staging flavour carries applicationIdSuffix ".staging", so the package
    # a staging manifest names is not the default com.am2.admin. Without this
    # the validator refuses every staging update set as the wrong application
    # -- "package is not the expected application" -- and the channel is dead
    # while the panel and the endpoint both look correctly configured.
    SetEnv AM2_ADMIN_UPDATE_PACKAGE com.am2.admin.staging

    # Defense in depth for requests that reach the loopback Apache origin
    # without passing through nginx.
    RedirectMatch 404 "^/(docs|infra|tests|\.github|\.git)(/|$)"
    RedirectMatch 404 "^/(package(-lock)?\.json|composer\.(json|lock)|README(\.[^/]*)?|CHANGELOG(\.[^/]*)?|server/struktur_am2\.sql)$"
    RedirectMatch 404 "^/(WebAdmin/)?(package(-lock)?\.json|node_modules(/|$))"

    <Directory /var/www/am2/staging/current/WebAdmin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The same three denies the production vhost carries.
    #
    # nginx denies these at the edge too, and this is the layer that still holds
    # when a request arrives another way -- Apache listens on 127.0.0.1:8081 and
    # anything on the host can reach it directly, which is exactly how the
    # contract tests bypass Cloudflare. Staging restores from a production dump,
    # so a config.php.bak left behind by a hand-edit is production's database
    # password sitting in the web root as plain text.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|ini|log|bak|sql|zip|tar|gz)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(setup[_-]?admin|setup|install|installer)\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog  /var/log/apache2/am2_staging_error.log
    # %h is the peer, and the peer is always nginx on the loopback, so the
    # stock `combined` format records 127.0.0.1 for every request ever made.
    # X-Real-IP is what nginx resolved -- the Cloudflare edge before
    # am2-cloudflare-realip.conf existed, the actual visitor after it. Logged
    # first so the address is the first thing on the line, where a reader looks.
    LogFormat "%{X-Real-IP}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" am2_visitor
    CustomLog /var/log/apache2/am2_staging_access.log am2_visitor
</VirtualHost>
