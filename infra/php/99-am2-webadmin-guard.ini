; AM2 WebAdmin second-layer guard. Managed by the sealed host-security bundle.
auto_prepend_file = /etc/am2/php/webadmin-prepend.php
; A release switch moves the document-root symlink. The default realpath cache
; keeps resolving PHP paths into the previous release for 120 seconds, so the
; lane guard run right after activation could check old code. The guard waits
; longer than this TTL before its first request.
realpath_cache_ttl = 2
; Look scripts up through the (bounded) realpath, not the unresolved
; /current/... path, so opcache cannot keep serving the previous release.
opcache.revalidate_path = 1
