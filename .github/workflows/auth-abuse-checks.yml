name: auth abuse checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - 'infra/nginx/**'
      - 'infra/contracts/host-security-contract.json'
      - 'tests/runtime-webadmin-login-limiter.py'
      - 'tests/unit/relay-auth-abuse.test.mjs'
      - '.github/workflows/auth-abuse-checks.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Prove pg error regression rejects a missing listener
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/auth-error-red"
          mkdir -p "$fixture"
          cp -R server tests "$fixture/"
          python3 - "$fixture/server/lib/protocol.js" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          listener = "                        client.on('error', loginClientError);\n"
          assert source.count(listener) == 1
          path.write_text(source.replace(listener, ''))
          PY
          set +e
          node --test --test-name-pattern='checked-out pg error' "$fixture/tests/unit/relay-auth-abuse.test.mjs" > "$RUNNER_TEMP/auth-error-red.log" 2>&1
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/auth-error-red.log" "$result" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          print(text)
          assert int(sys.argv[2]) != 0
          assert '# fail 2' in text
          assert 'checked-out pg client has no owner for error events' in text
          PY
      - name: Prove case-distinct account regression rejects a shared key
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/auth-account-red"
          mkdir -p "$fixture"
          cp -R server tests "$fixture/"
          python3 - "$fixture/server/lib/protocol.js" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          assert source.count('const accountKey = uid;') == 1
          path.write_text(source.replace('const accountKey = uid;', 'const accountKey = uid.toLowerCase();'))
          PY
          set +e
          node --test --test-name-pattern='case-distinct database account IDs' "$fixture/tests/unit/relay-auth-abuse.test.mjs" > "$RUNNER_TEMP/auth-account-red.log" 2>&1
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/auth-account-red.log" "$result" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          print(text)
          assert int(sys.argv[2]) != 0
          assert '# fail 1' in text
          assert 'case-distinct account inherited another database ID retry budget' in text
          PY
      - name: Credential-free relay behavior and unit regressions
        run: node --test tests/unit/*.test.mjs
  # Origin reachability is an operator probe, never a recurring PR test.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nginx only on disposable runner
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Real isolated nginx login budget regression
        run: python3 tests/runtime-webadmin-login-limiter.py
