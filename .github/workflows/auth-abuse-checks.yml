name: auth abuse checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - 'infra/nginx/**'
      - 'infra/contracts/host-security-contract.json'
      - 'tests/runtime-webadmin-login-limiter.py'
      - 'tests/unit/relay-auth-abuse.test.mjs'
      - '.github/workflows/auth-abuse-checks.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Credential-free relay behavior and unit regressions
        run: node --test tests/unit/*.test.mjs
  origin-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Single unauthenticated origin GET from external runner
        shell: bash
        run: |
          set -euo pipefail
          origin=$(getent ahostsv4 apiapi.am2-poc.com | cut -d ' ' -f 1 | sort -u)
          test "$(printf '%s\n' "$origin" | wc -l)" -eq 1
          curl --silent --show-error --max-time 15 --resolve "webadmin.am2-poc.com:443:$origin" \
            --dump-header "$RUNNER_TEMP/origin-headers" --output /dev/null \
            --write-out 'direct-origin status=%{http_code}\n' https://webadmin.am2-poc.com/login.php
          python3 - "$RUNNER_TEMP/origin-headers" <<'PY'
          import pathlib, sys
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if line.lower().startswith(('http/', 'server:', 'cf-ray:', 'cf-mitigated:')):
                  print(line)
          PY
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nginx only on disposable runner
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Real isolated nginx login budget regression
        run: python3 tests/runtime-webadmin-login-limiter.py
