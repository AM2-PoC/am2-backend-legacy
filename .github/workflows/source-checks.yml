# Source-only checks: no deployment credentials or persistent services.

name: source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  materialization-privileges:
    name: root-owned materialization (disposable runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Pin the service executable path on the disposable runner
        run: sudo ln -s "$(command -v node)" /usr/bin/node
      - name: Real cross-UID and retained writable descriptor regression
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 tests/runtime-materialization-privileged.py

  php:
    name: php -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint every PHP file
        run: |
          # Not `find -exec php -l` alone: php -l exits non-zero per file but a
          # bare loop would let the last file decide the job.
          fail=0
          while IFS= read -r f; do
              php -l "$f" > /dev/null || { echo "SYNTAX: $f"; fail=1; }
          done < <(find WebAdmin -name '*.php' -not -path '*/node_modules/*')
          exit $fail

  node:
    name: node --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Parse every server-side script
        run: |
          fail=0
          while IFS= read -r f; do
              node --check "$f" || { echo "SYNTAX: $f"; fail=1; }
          done < <(find server -name '*.js' -not -path '*/node_modules/*')
          exit $fail
      - name: Run relay authorization unit tests
        run: node --test tests/unit/*.test.mjs

  assets:
    name: built assets match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: WebAdmin/package-lock.json
      - run: npm --prefix WebAdmin ci
      - run: npm --prefix WebAdmin run build
      - name: The committed CSS and JS must be what the source builds
        run: |
          # Runtime packages include generated assets; source and committed
          # output must remain synchronized.
          if ! git diff --exit-code -- WebAdmin/asset; then
              echo "::error::Built assets differ from their source. Run 'npm --prefix WebAdmin run build' and commit the result."
              exit 1
          fi

  tests:
    name: contract tests (offline subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out audited Admin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AM2-PoC/am2-android-admin
          ref: 6a8f2a010fd855afc57100f5f6beb7e75279104a
          path: .ci/admin-source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run the tests that need no credentials and no network
        env:
          AM2_ADMIN_CHECKOUT: ${{ github.workspace }}/.ci/admin-source
          NPM_CONFIG_PREFER_OFFLINE: 'true'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: |
          # Discover offline suites dynamically so new contracts cannot be
          # omitted from CI by a stale file list.
          mapfile -t files < <(./tests/offline-tests.sh)
          if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No offline tests were selected; the selector is broken."
              exit 1
          fi
          # The coverage guard is itself a selected suite. If its own text trips
          # the selector it stops running, and nothing inside it can say so.
          if ! printf '%s\n' "${files[@]}" | grep -qx offline-selector-coverage.test.mjs; then
              echo "::error::The selector coverage guard is not selected, so skipped suites would go unnoticed."
              exit 1
          fi
          printf 'running %d files\n' "${#files[@]}"
          # Split by extension: the selector now emits PHP contract tests too,
          # and `node --test` on a .php file fails in a way that reads like a
          # broken test rather than a wrong runner.
          mjs=(); php=()
          for f in "${files[@]}"; do
              case "$f" in
                  release-runtime.test.mjs|systemd-relay-safety.test.mjs) ;; # privileged restart-safety job below
                  *.test.mjs) mjs+=("tests/contract/$f") ;;
                  *.test.php) php+=("tests/contract/$f") ;;
                  *) echo "::error::no runner for $f"; exit 1 ;;
              esac
          done
          if [ ${#mjs[@]} -gt 0 ]; then
              node --test --test-concurrency=1 "${mjs[@]}"
          fi
          for f in "${php[@]}"; do
              echo "--- $f"
              php "$f"
          done

  webadmin-toolchain-contract:
    name: WebAdmin toolchain contract
    runs-on: ubuntu-24.04
    container: ubuntu@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.10'
          tools: composer:2.10.3
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_pgsql, pgsql, session, tokenizer, xml, zip
          coverage: none
      - name: Verify clean-room prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          grep -qx 'VERSION_ID="26.04"' /etc/os-release
          test "$(node --version)" = v24.21.0
          test "$(php -r 'echo PHP_VERSION;')" = 8.5.10
          test "$(composer --version --no-ansi | awk '{print $3}')" = 2.10.3
          composer_path=$(command -v composer)
          test "$(sha256sum "$composer_path" | awk '{print $1}')" = 7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
          for extension in ctype curl dom fileinfo filter hash mbstring openssl pcre PDO pdo_pgsql pgsql session tokenizer xml zip; do
              php -m | grep -Fxi "$extension"
          done
      - name: Install locked dependency graphs cleanly
        working-directory: laravel
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer check-platform-reqs --lock
          composer audit --locked --abandoned=fail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Laravel health and panel contracts
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -euo pipefail
          mkdir -p laravel/bootstrap/cache
          php tests/contract/laravel-health.test.php
          php tests/contract/filament-panel.test.php
      - name: Verify dependency lock requirements
        run: |
          set -euo pipefail
          node --test tests/contract/platform-baseline.test.mjs
          npm --prefix laravel audit --audit-level=high
  restart-safety:
    name: restart-safe release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Pin the service executable path on the disposable runner
        run: sudo ln -s "$(command -v node)" /usr/bin/node
      - name: Run restart-safety contracts
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: |
          sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" node --test --test-concurrency=1 \
            tests/contract/needrestart-policy.test.mjs \
            tests/contract/release-runtime.test.mjs \
            tests/contract/release-smoke.test.mjs \
            tests/contract/relay-watchdog.test.mjs \
            tests/contract/systemd-relay-safety.test.mjs
      - name: Build and verify exact candidate commit
        run: |
          sha=$(git rev-parse HEAD)
          destination="$RUNNER_TEMP/am2-$sha"
          infra/scripts/build-release.sh \
            --repo "$GITHUB_WORKSPACE" \
            --sha "$sha" \
            --dest "$destination"
          infra/scripts/verify-release-runtime.sh "$destination" "$sha"

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The local stack must still describe itself
        run: |
          cp .env.example .env
          docker compose config > /dev/null

  protocol:
    # Exercise login, join, PTT, media relay, and release against the relay
    # built from this commit.
    name: protocol suite (containerised relay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the relay's own dependencies for the harness
        # Before the stack, not after. Compose mounts a named volume at
        # /app/node_modules, and Docker creates the host-side mount point as
        # root -- so starting first leaves server/node_modules unwritable and
        # npm fails with EACCES. The container keeps using its own volume
        # either way; this copy is only what the harness imports `ws` from.
        run: npm --prefix server ci --omit=dev
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --wait db redis relay
      - name: The fixture units must be seeded
        run: |
          set -euo pipefail
          # A missing seed would otherwise surface as a login timeout, which
          # reads as a relay fault rather than a fixture one.
          count=$(docker compose exec -T db psql -U am2 -d am2 -tAc \
              "SELECT count(*) FROM public.users WHERE id LIKE 'CT\_%'")
          test "$count" -eq 4 || { echo "::error::expected 4 fixture units, found $count"; exit 1; }
      - name: Run the protocol suite
        env:
          CT_NODE_URL: http://127.0.0.1:5000
          CT_SERVER_JS: ${{ github.workspace }}/server/server.js
          CT_PSQL: docker compose exec -T db psql -U am2 -d am2
        run: |
          set -euo pipefail
          # The password is the one in the seed, which is the source of truth
          # for a container that exists for the length of this job.
          printf 'CT_PTT_PASS=devpassword123\nCT_NODE_URL=%s\n' "$CT_NODE_URL" > "$RUNNER_TEMP/ct.env"
          # The admin routes need the relay's own key. The container reads it
          # from .env, which this job copied from .env.example, so that file is
          # the source of truth here the same way the seed password is.
          CT_RELAY_ENV_FILE="$GITHUB_WORKSPACE/.env" \
            CT_ENV_FILE="$RUNNER_TEMP/ct.env" bash tests/run-protocol.sh
      - name: Relay log on failure
        if: failure()
        run: docker compose logs --no-color relay | tail -100
