# The checks that need nothing but the checkout.
#
# There was no CI at all. Everything here already passed on someone's machine
# before a release -- which is the problem: it passed when somebody remembered
# to run it, and the failure mode of a forgotten check is indistinguishable from
# a passing one.
#
# Deliberately no secrets and no services. Most of the contract suite needs a
# staging host and a protected env file, and wiring those into CI would mean
# putting production-shaped credentials into GitHub. That suite stays on the
# VPS, run before a release. What runs here is the part that only needs source,
# which is also the part that catches the mistakes made most often: a syntax
# error, a built asset that no longer matches what built it.

name: source checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: php -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint every PHP file
        run: |
          # Not `find -exec php -l` alone: php -l exits non-zero per file but a
          # bare loop would let the last file decide the job.
          fail=0
          while IFS= read -r f; do
              php -l "$f" > /dev/null || { echo "SYNTAX: $f"; fail=1; }
          done < <(find WebAdmin -name '*.php' -not -path '*/node_modules/*')
          exit $fail

  node:
    name: node --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse every server-side script
        run: |
          fail=0
          while IFS= read -r f; do
              node --check "$f" || { echo "SYNTAX: $f"; fail=1; }
          done < <(find server -name '*.js' -not -path '*/node_modules/*')
          exit $fail
      - name: Run relay authorization unit tests
        run: node --test tests/unit/*.test.mjs

  assets:
    name: built assets match their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: WebAdmin/package-lock.json
      - run: npm --prefix WebAdmin ci
      - run: npm --prefix WebAdmin run build
      - name: The committed CSS and JS must be what the source builds
        run: |
          # The bundle is committed because deploys copy an archive rather than
          # building on the host. That only works while the two agree, and the
          # way they stop agreeing is an edit to a src/ file that nobody
          # rebuilt -- invisible in review, because the diff looks complete.
          if ! git diff --exit-code -- WebAdmin/asset; then
              echo "::error::Built assets differ from their source. Run 'npm --prefix WebAdmin run build' and commit the result."
              exit 1
          fi

  tests:
    name: contract tests (offline subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run the tests that need no credentials and no network
        run: |
          # The set is computed, not listed: a hand-maintained list goes stale
          # the first time somebody adds a test and forgets, and a test that
          # never runs looks exactly like a test that passes.
          mapfile -t files < <(./tests/offline-tests.sh)
          if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No offline tests were selected; the selector is broken."
              exit 1
          fi
          printf 'running %d files\n' "${#files[@]}"
          # Split by extension: the selector now emits PHP contract tests too,
          # and `node --test` on a .php file fails in a way that reads like a
          # broken test rather than a wrong runner.
          mjs=(); php=()
          for f in "${files[@]}"; do
              case "$f" in
                  *.test.mjs) mjs+=("tests/contract/$f") ;;
                  *.test.php) php+=("tests/contract/$f") ;;
                  *) echo "::error::no runner for $f"; exit 1 ;;
              esac
          done
          if [ ${#mjs[@]} -gt 0 ]; then
              node --test "${mjs[@]}"
          fi
          for f in "${php[@]}"; do
              echo "--- $f"
              php "$f"
          done

  restart-safety:
    name: restart-safe release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Run restart-safety contracts
        run: |
          node --test \
            tests/contract/needrestart-policy.test.mjs \
            tests/contract/release-runtime.test.mjs \
            tests/contract/release-smoke.test.mjs \
            tests/contract/relay-watchdog.test.mjs \
            tests/contract/systemd-relay-safety.test.mjs
      - name: Build and verify exact candidate commit
        run: |
          sha=$(git rev-parse HEAD)
          destination="$RUNNER_TEMP/am2-$sha"
          infra/scripts/build-release.sh \
            --repo "$GITHUB_WORKSPACE" \
            --sha "$sha" \
            --dest "$destination"
          infra/scripts/verify-release-runtime.sh "$destination" "$sha"

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The local stack must still describe itself
        run: |
          cp .env.example .env
          docker compose config > /dev/null

  protocol:
    # The suite that drives the real wire -- login, join, key the mic, relay a
    # frame, release -- could only ever run by hand against staging, because the
    # units it signs in as existed only there. So the one test layer that
    # exercises the protocol never ran here, and a protocol test that was broken
    # could reach main and stay there. That happened, and this is the answer:
    # the same suite, against a relay built from this commit.
    name: protocol suite (containerised relay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the relay's own dependencies for the harness
        # Before the stack, not after. Compose mounts a named volume at
        # /app/node_modules, and Docker creates the host-side mount point as
        # root -- so starting first leaves server/node_modules unwritable and
        # npm fails with EACCES. The container keeps using its own volume
        # either way; this copy is only what the harness imports `ws` from.
        run: npm --prefix server ci --omit=dev
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --wait db redis relay
      - name: The fixture units must be seeded
        run: |
          set -euo pipefail
          # A missing seed would otherwise surface as a login timeout, which
          # reads as a relay fault rather than a fixture one.
          count=$(docker compose exec -T db psql -U am2 -d am2 -tAc \
              "SELECT count(*) FROM public.users WHERE id LIKE 'CT\_%'")
          test "$count" -eq 4 || { echo "::error::expected 4 fixture units, found $count"; exit 1; }
      - name: Run the protocol suite
        env:
          CT_NODE_URL: http://127.0.0.1:5000
          CT_SERVER_JS: ${{ github.workspace }}/server/server.js
          CT_PSQL: docker compose exec -T db psql -U am2 -d am2
        run: |
          set -euo pipefail
          # The password is the one in the seed, which is the source of truth
          # for a container that exists for the length of this job.
          printf 'CT_PTT_PASS=devpassword123\nCT_NODE_URL=%s\n' "$CT_NODE_URL" > "$RUNNER_TEMP/ct.env"
          # The admin routes need the relay's own key. The container reads it
          # from .env, which this job copied from .env.example, so that file is
          # the source of truth here the same way the seed password is.
          CT_RELAY_ENV_FILE="$GITHUB_WORKSPACE/.env" \
            CT_ENV_FILE="$RUNNER_TEMP/ct.env" bash tests/run-protocol.sh
      - name: Relay log on failure
        if: failure()
        run: docker compose logs --no-color relay | tail -100
