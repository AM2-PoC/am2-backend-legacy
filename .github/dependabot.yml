version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      server-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /WebAdmin
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      webadmin-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
